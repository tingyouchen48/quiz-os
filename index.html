<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作業系統與演算法題庫筆記</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-12">

  <!-- 頂部 Toast 通知 -->
  <div id="toast" class="fixed top-5 right-5 z-50 transform translate-y-[-100px] opacity-0 transition-all duration-300 ease-in-out max-w-md bg-slate-900 text-white px-5 py-3.5 rounded-xl shadow-2xl flex items-center gap-3 border border-slate-700 pointer-events-none">
    <div id="toastIcon" class="text-xl flex-shrink-0">✨</div>
    <div id="toastMessage" class="text-sm font-medium">通知訊息</div>
  </div>

  <!-- 自訂確認對話方塊 (Modal) -->
  <div id="confirmModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 transform scale-95 transition-transform duration-200" id="modalBox">
      <h3 id="modalTitle" class="text-lg font-bold text-slate-800 mb-2">確認操作</h3>
      <p id="modalMessage" class="text-sm text-slate-600 mb-6 leading-relaxed">您確定要執行此操作嗎？</p>
      <div class="flex justify-end gap-3">
        <button id="modalCancelBtn" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition">取消</button>
        <button id="modalConfirmBtn" class="px-4 py-2 rounded-lg text-sm font-medium bg-red-600 text-white hover:bg-red-700 transition shadow-sm">確認清空</button>
      </div>
    </div>
  </div>

  <div class="max-w-4xl mx-auto px-4 pt-8">

    <!-- 標頭 -->
    <header class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 gap-4 border-b border-slate-200 pb-5">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-blue-600 tracking-tight flex items-center gap-2">
          <span>📚</span> 作業系統與演算法題庫筆記
        </h1>
        <p class="text-sm text-slate-500 mt-1">智慧雙模解析 · 自動相容 JSON / 試煉文字 · 快速檢索</p>
      </div>
      <div class="flex items-center gap-2 text-xs font-semibold">
        <span class="bg-blue-50 text-blue-700 border border-blue-200 px-3 py-1.5 rounded-full shadow-sm" id="headerStatTotal">
          收錄: 0 題
        </span>
        <span class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-full shadow-sm" id="headerStatChapter">
          章節: 0 個
        </span>
      </div>
    </header>

    <!-- 輸入與匯入區塊 -->
    <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm mb-8 transition hover:shadow-md">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <span class="text-blue-500">📥</span> 匯入題庫資料
        </h2>
        <span class="text-xs text-slate-400 font-normal">支援貼上文字/JSON 或直接上傳檔案</span>
      </div>

      <!-- 章節名稱輸入欄 -->
      <div class="mb-4">
        <label for="chapterInput" class="block text-xs font-semibold text-slate-600 mb-1.5">
          預設章節 / 單元名稱 <span class="text-slate-400 font-normal">(文字若包含「本次在...修練」或 JSON 內含章節欄位將自動覆蓋)</span>
        </label>
        <input type="text" id="chapterInput" placeholder="例如：2術法演場(練氣前期) 或 第2單元題庫" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
      </div>

      <!-- 內容貼上文字框 -->
      <div class="mb-4">
        <textarea id="rawInput" placeholder="直接在此貼上測驗結束頁面全文，或者貼上 JSON 陣列/物件格式文字..." class="w-full h-36 p-3.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition custom-scrollbar font-mono text-slate-700"></textarea>
      </div>

      <!-- 隱藏的 File Input -->
      <input type="file" id="fileInput" accept=".json" class="hidden" onchange="handleFileUpload(event)">

      <!-- 操作按鈕區 -->
      <div class="flex flex-wrap items-center gap-2.5">
        <button onclick="importText()" class="flex-1 min-w-[140px] bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-sm px-4 py-2.5 rounded-xl transition shadow-sm flex items-center justify-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          解析並新增題庫
        </button>

        <button onclick="triggerFileInput()" class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-medium text-sm px-4 py-2.5 rounded-xl transition shadow-sm flex items-center justify-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          📂 匯入 JSON 檔案
        </button>

        <button onclick="exportData()" class="bg-slate-600 hover:bg-slate-700 active:bg-slate-800 text-white font-medium text-sm px-4 py-2.5 rounded-xl transition shadow-sm flex items-center justify-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          💾 匯出 JSON
        </button>

        <button onclick="promptClearData()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 hover:text-rose-700 font-medium text-sm px-4 py-2.5 rounded-xl transition border border-rose-200/60 flex items-center justify-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          清空題庫
        </button>
      </div>
    </div>

    <!-- 搜尋與篩選列 -->
    <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm mb-6">
      <div class="flex flex-col md:flex-row gap-3 mb-4">
        <!-- 關鍵字搜尋 -->
        <div class="relative flex-2 md:w-2/3">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </div>
          <input type="text" id="searchInput" placeholder="搜尋題目或答案關鍵字..." oninput="render()" class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
        </div>

        <!-- 章節下拉選單 -->
        <div class="md:w-1/3">
          <select id="chapterSelect" onchange="render()" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition text-slate-700">
            <option value="ALL">所有章節</option>
          </select>
        </div>
      </div>

      <!-- 統計數據 -->
      <div class="flex items-center justify-between text-xs text-slate-500 font-medium pt-2 border-t border-slate-100" id="stats">
        <span>目前收錄：0 題</span>
        <span>篩選顯示：0 題</span>
      </div>
    </div>

    <!-- 題庫列表區 -->
    <div id="qaList" class="space-y-4">
      <!-- 動態載入 QA Card -->
    </div>

  </div>

  <!-- JavaScript 邏輯 -->
  <script>
    // 資料庫存取
    let db = JSON.parse(localStorage.getItem('os_alg_db') || '[]');

    function saveDB() {
      localStorage.setItem('os_alg_db', JSON.stringify(db));
      render();
    }

    // UI Toast 提示訊息
    function showToast(msg, icon = '✨') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMessage');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.innerText = msg;
      toastIcon.innerText = icon;

      toast.classList.remove('translate-y-[-100px]', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-[-100px]', 'opacity-0', 'pointer-events-none');
      }, 3000);
    }

    // UI 自訂確認視窗 (替代 confirm)
    let confirmCallback = null;

    function promptClearData() {
      if (db.length === 0) {
        showToast('目前題庫已是空的！', 'ℹ️');
        return;
      }
      openConfirmModal('確定要清空題庫嗎？', '此操作將刪除目前儲存的所有題目筆記，且無法還原。', () => {
        db = [];
        saveDB();
        showToast('已成功清空所有題庫', '🗑️');
      });
    }

    function openConfirmModal(title, msg, onConfirm) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMessage').innerText = msg;
      confirmCallback = onConfirm;

      const modal = document.getElementById('confirmModal');
      const modalBox = document.getElementById('modalBox');

      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modalBox.classList.remove('scale-95');
        modalBox.classList.add('scale-100');
      }, 10);
    }

    function closeConfirmModal() {
      const modal = document.getElementById('confirmModal');
      const modalBox = document.getElementById('modalBox');

      modalBox.classList.remove('scale-100');
      modalBox.classList.add('scale-95');
      modal.classList.add('opacity-0');

      setTimeout(() => {
        modal.classList.add('hidden');
        confirmCallback = null;
      }, 200);
    }

    document.getElementById('modalCancelBtn').addEventListener('click', closeConfirmModal);
    document.getElementById('modalConfirmBtn').addEventListener('click', () => {
      if (confirmCallback) confirmCallback();
      closeConfirmModal();
    });

    // 觸發檔案選擇器
    function triggerFileInput() {
      document.getElementById('fileInput').click();
    }

    // 處理檔案上傳匯入
    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const content = e.target.result;
        processImportContent(content);
        event.target.value = ''; // 重置 input
      };
      reader.readAsText(file);
    }

    // 統一處理文字與 JSON 解析匯入
    function importText() {
      const raw = document.getElementById('rawInput').value;
      if (!raw.trim()) {
        showToast('請先貼上測驗內容或 JSON 字串！', '⚠️');
        return;
      }
      processImportContent(raw);
    }

    function processImportContent(raw) {
      const defaultChapter = document.getElementById('chapterInput').value.trim() || '未分類章節';
      const trimmed = raw.trim();

      // 檢查是否為 JSON 格式 (以 [ 或 { 開頭)
      if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
        try {
          const parsed = JSON.parse(trimmed);
          const count = parseJSONContent(parsed, defaultChapter);
          document.getElementById('rawInput').value = '';
          document.getElementById('chapterInput').value = '';
          saveDB();
          showToast(`JSON 匯入完成！新增/更新了 ${count} 筆題目`, '🎉');
          return;
        } catch (err) {
          // 若 JSON 解析失敗，回退至純文字解析
          console.warn('JSON 解析嘗試失敗，降級使用純文字解析:', err);
        }
      }

      // 純文字測驗頁面解析邏輯
      const count = parseTextContent(raw, defaultChapter);
      document.getElementById('rawInput').value = '';
      document.getElementById('chapterInput').value = '';
      saveDB();
      showToast(`文字解析完成！新增/更新了 ${count} 筆題目`, '🎉');
    }

    // 解析 JSON 結構
    function parseJSONContent(parsedData, fallbackChapter) {
      let itemsArray = [];

      if (Array.isArray(parsedData)) {
        itemsArray = parsedData;
      } else if (typeof parsedData === 'object' && parsedData !== null) {
        // 如果傳入的是單一物件，或者包含 items/data/quiz 陣列的物件
        if (Array.isArray(parsedData.items)) itemsArray = parsedData.items;
        else if (Array.isArray(parsedData.data)) itemsArray = parsedData.data;
        else if (Array.isArray(parsedData.quiz)) itemsArray = parsedData.quiz;
        else itemsArray = [parsedData];
      }

      let count = 0;

      itemsArray.forEach(item => {
        if (!item || typeof item !== 'object') return;

        // 題目 Key 自動相容
        let question = item.q || item.question || item.title || item.Q || '';
        if (typeof question !== 'string') question = String(question);
        question = question.trim();

        // 答案 Key 自動相容
        let rawAnswer = item.a ?? item.answer ?? item.correct ?? item.ans ?? item.A ?? '';
        let answer = '';

        if (Array.isArray(rawAnswer)) {
          // 若答案為多選題陣列，使用 [NEXT_OPT] 分隔
          answer = rawAnswer.map(v => String(v).trim()).filter(Boolean).join('[NEXT_OPT]');
        } else if (typeof rawAnswer === 'object' && rawAnswer !== null) {
          answer = JSON.stringify(rawAnswer);
        } else {
          answer = String(rawAnswer).trim();
        }

        // 章節 Key 自動相容
        let chapter = item.chapter || item.unit || item.category || item.section || fallbackChapter;
        if (typeof chapter !== 'string') chapter = String(chapter);
        chapter = chapter.trim() || '未分類章節';

        if (question && answer) {
          upsertQuestion(question, answer, chapter);
          count++;
        }
      });

      return count;
    }

    // 解析測驗結束頁面純文字
    function parseTextContent(raw, fallbackChapter) {
      let detectedChapter = '';
      const chapterMatch = raw.match(/本次在「(.*?)」的修練已結束/);

      if (chapterMatch && chapterMatch[1]) {
        detectedChapter = chapterMatch[1].trim();
      } else {
        detectedChapter = fallbackChapter;
      }
      if (!detectedChapter) detectedChapter = '未分類章節';

      const rawBlocks = raw.split(/(?:\*?題目：\*?)/);
      let count = 0;

      rawBlocks.forEach(block => {
        if (!block.trim()) return;

        const lines = block.split('\n').map(l => l.trim()).filter(l => l !== '');
        let qParts = [];
        let aParts = [];
        let state = 'q';

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          if (line.match(/^\*?你的答案：\*?/)) {
            state = 'your';
          } else if (line.match(/^\*?正確答案：\*?/)) {
            state = 'correct';
            const inlineVal = line.replace(/^\*?正確答案：\*?/, '').trim();
            if (inlineVal) aParts.push(inlineVal);
          } else if (line.match(/^\*?得分：\*?/)) {
            state = 'score';
          } else {
            if (state === 'q') {
              qParts.push(line);
            } else if (state === 'correct') {
              aParts.push(line);
            }
          }
        }

        const question = qParts.join(' ').trim();
        const answer = aParts.join('[NEXT_OPT]').trim();

        if (question && answer) {
          upsertQuestion(question, answer, detectedChapter);
          count++;
        }
      });

      return count;
    }

    // 新增或更新題目
    function upsertQuestion(question, answer, chapter) {
      const existingIdx = db.findIndex(item => item.q === question);
      if (existingIdx !== -1) {
        db[existingIdx].a = answer;
        db[existingIdx].chapter = chapter;
      } else {
        db.push({ q: question, a: answer, chapter: chapter });
      }
    }

    // 更新下拉選單
    function updateChapterDropdown() {
      const chapterSelect = document.getElementById('chapterSelect');
      const currentVal = chapterSelect.value;

      const chapters = Array.from(new Set(db.map(item => item.chapter || '未分類章節')));

      chapterSelect.innerHTML = '<option value="ALL">所有章節</option>' + 
        chapters.map(ch => `<option value="${escapeHtml(ch)}">${escapeHtml(ch)}</option>`).join('');

      if (chapters.includes(currentVal)) {
        chapterSelect.value = currentVal;
      } else {
        chapterSelect.value = 'ALL';
      }

      // 更新 Header 統計標籤
      document.getElementById('headerStatTotal').innerText = `收錄: ${db.length} 題`;
      document.getElementById('headerStatChapter').innerText = `章節: ${chapters.length} 個`;
    }

    // 格式化答案顯示 (將 [NEXT_OPT] 轉為質感筆記點符號列表)
    function formatAnswer(ans) {
      if (!ans) return '';
      let parts = [];

      if (ans.includes('[NEXT_OPT]')) {
        parts = ans.split('[NEXT_OPT]').map(p => p.trim()).filter(Boolean);
      } else if (ans.includes(' / ')) {
        parts = ans.split(' / ').map(p => p.trim()).filter(Boolean);
      } else {
        parts = [ans];
      }

      if (parts.length > 1) {
        return `<ul class="space-y-1.5 mt-1">` + 
          parts.map(p => `
            <li class="flex items-start gap-2">
              <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 mt-2 flex-shrink-0"></span>
              <span>${escapeHtml(p)}</span>
            </li>
          `).join('') + 
          `</ul>`;
      }

      return `<div class="mt-0.5">${escapeHtml(ans)}</div>`;
    }

    // 複製文字至剪貼簿
    function copyText(text) {
      // 替代 navigator.clipboard 避免 iFrame 限制
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand('copy');
      document.body.removeChild(textArea);
      showToast('已複製至剪貼簿！', '📋');
    }

    // 刪除單一題目
    function deleteItem(index) {
      openConfirmModal('確定要刪除這題嗎？', '刪除後該筆題目將從資料庫中移除。', () => {
        db.splice(index, 1);
        saveDB();
        showToast('已刪除該題筆記', '🗑️');
      });
    }

    // 畫面渲染
    function render() {
      updateChapterDropdown();

      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedChapter = document.getElementById('chapterSelect').value;
      const listEl = document.getElementById('qaList');

      const filtered = db.map((item, originalIndex) => ({ ...item, originalIndex }))
        .filter(item => {
          const ch = item.chapter || '未分類章節';
          const matchesChapter = (selectedChapter === 'ALL' || ch === selectedChapter);
          const matchesQuery = !query || 
            item.q.toLowerCase().includes(query) || 
            item.a.toLowerCase().includes(query);
          return matchesChapter && matchesQuery;
        });

      document.getElementById('stats').innerHTML = `
        <span>目前收錄：<b>${db.length}</b> 題</span>
        <span>篩選顯示：<b>${filtered.length}</b> 題</span>
      `;

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="bg-white rounded-2xl p-12 text-center border border-slate-200">
            <div class="text-4xl mb-3">🔍</div>
            <div class="text-slate-500 font-medium text-sm">尚無符合的題目筆記</div>
            <div class="text-xs text-slate-400 mt-1">請嘗試變更搜尋關鍵字或匯入新題庫</div>
          </div>
        `;
        return;
      }

      listEl.innerHTML = filtered.map((item, displayIdx) => `
        <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm hover:shadow-md transition group">
          <div class="flex items-center justify-between mb-3">
            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-100">
              📖 ${escapeHtml(item.chapter || '未分類章節')}
            </span>

            <div class="flex items-center gap-1 opacity-80 group-hover:opacity-100 transition">
              <button onclick="copyText('${escapeJsString(item.q + '\n正確答案：\n' + item.a.replace(/\[NEXT_OPT\]/g, '\n'))}')" class="p-1.5 text-slate-400 hover:text-blue-600 rounded-lg hover:bg-blue-50 transition" title="複製題目與答案">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
              </button>
              <button onclick="deleteItem(${item.originalIndex})" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-rose-50 transition" title="刪除此題">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
          </div>

          <div class="text-slate-800 font-semibold text-base leading-relaxed mb-3">
            <span class="text-blue-600 font-bold mr-1.5">${displayIdx + 1}.</span>${escapeHtml(item.q)}
          </div>

          <div class="bg-emerald-50/60 border border-emerald-200/80 rounded-xl p-3.5 text-emerald-900 text-sm">
            <div class="text-xs font-bold text-emerald-700 mb-1 flex items-center gap-1">
              <span>✓</span> 正確答案
            </div>
            <div class="font-medium">
              ${formatAnswer(item.a)}
            </div>
          </div>
        </div>
      `).join('');
    }

    // 工具函式：轉義 HTML 特殊字元
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 工具函式：轉義 JS 字串
    function escapeJsString(str) {
      if (!str) return '';
      return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n');
    }

    // 匯出 JSON 檔案
    function exportData() {
      if (db.length === 0) {
        showToast('目前沒有任何題庫資料可匯出！', '⚠️');
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
      const anchor = document.createElement('a');
      anchor.setAttribute("href", dataStr);
      anchor.setAttribute("download", `quiz_database_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      showToast('已成功匯出 JSON 檔案！', '💾');
    }

    // 初始化渲染
    render();
  </script>
</body>
</html>
